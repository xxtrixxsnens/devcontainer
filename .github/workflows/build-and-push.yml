name: Build and Push Development Images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    name: Detect changed images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      uplift-rust: ${{ steps.matrix.outputs.uplift-rust }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect changed files
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            node-dev:
              - 'Containerfile.node'
              - 'scripts/**'
              - '.github/workflows/**'
            python-dev:
              - 'Containerfile.python'
              - 'scripts/**'
              - '.github/workflows/**'
            python-dev-ubuntu:
              - 'Containerfile.ubuntu.python'
              - 'scripts/**'
              - '.github/workflows/**'
            rust-dev:
              - 'Containerfile.rust'
              - 'scripts/**'
              - '.github/workflows/**'
            uplift:
              - 'Containerfile.uplift'
              - 'scripts/**'
              - '.github/workflows/**'
            uplift-rust:
              - 'Containerfile.uplift-rust'
              - 'scripts/**'
              - '.github/workflows/**'
              - 'Containerfile.rust'
            fio:
              - 'Containerfile.fio'
              - 'scripts/**'
              - '.github/workflows/**'
            sysbench:
              - 'Containerfile.sysbench'
              - 'scripts/**'
              - '.github/workflows/**'

      - name: Generate build matrix
        id: matrix
        env:
          NODE: ${{ steps.filter.outputs.node-dev }}
          PYTHON: ${{ steps.filter.outputs.python-dev }}
          UBUNTU_PYTHON: ${{ steps.filter.outputs.python-dev-ubuntu }}
          RUST: ${{ steps.filter.outputs.rust-dev }}
          UPLIFT: ${{ steps.filter.outputs.uplift }}
          UPLIFT_RUST: ${{ steps.filter.outputs.uplift-rust }}
          FIO: ${{ steps.filter.outputs.fio }}
          SYSBENCH: ${{ steps.filter.outputs.sysbench }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json
          import os

          manual = os.environ["EVENT_NAME"] == "workflow_dispatch"
          uplift_rust = manual or os.environ["UPLIFT_RUST"] == "true"

          images = [
              ("node-dev", "Containerfile.node", "3.20", "NODE"),
              ("python-dev", "Containerfile.python", "3.20", "PYTHON"),
              ("python-dev-ubuntu", "Containerfile.ubuntu.python", "24.04", "UBUNTU_PYTHON"),
              ("rust-dev", "Containerfile.rust", "1.91", "RUST"),
              ("uplift", "Containerfile.uplift", "latest", "UPLIFT"),
              ("fio", "Containerfile.fio", "3.36", "FIO"),
              ("sysbench", "Containerfile.sysbench", "1.0.20", "SYSBENCH"),
          ]

          matrix = [
              {
                  "image-name": name,
                  "file": file,
                  "tag": tag,
              }
              for name, file, tag, env_name in images
              if manual
              or os.environ[env_name] == "true"
              or (name == "rust-dev" and uplift_rust)
          ]

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"matrix={json.dumps(matrix)}\n")
              output.write(f"uplift-rust={str(uplift_rust).lower()}\n")
          PY

  build-and-push:
    name: Build and Push Base Images
    needs: changes
    if: needs.changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set image prefix
        run: |
          echo "IMAGE_PREFIX=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image-name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ matrix.tag }},enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-uplift-rust:
    name: Build and Push Uplift Rust Image
    needs:
      - changes
      - build-and-push
    if: >-
      always() &&
      needs.changes.outputs.uplift-rust == 'true' &&
      needs.changes.result == 'success' &&
      (needs.build-and-push.result == 'success' ||
       needs.build-and-push.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set image prefix
        run: |
          echo "IMAGE_PREFIX=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/uplift-rust
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile.uplift-rust
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            RUST_BASE_IMAGE=${{ env.IMAGE_PREFIX }}/rust-dev:1.91
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

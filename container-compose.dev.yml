services:
  node-dev:
    build:
      context: .
      dockerfile: Containerfile.node
    container_name: node_dev
    userns_mode: "keep-id"
    working_dir: /workplace
    volumes:
      - .:/workplace:Z
    # Keep container alive so you can attach or run commands
    stdin_open: true
    tty: true

  python-dev:
    build:
      context: .
      dockerfile: Containerfile.python
    container_name: python_dev
    userns_mode: "keep-id"
    working_dir: /workplace
    volumes:
      - .:/workplace:Z
    # Keep container alive so you can attach or run commands
    stdin_open: true
    tty: true
